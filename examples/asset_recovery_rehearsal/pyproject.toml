[project]
name = "asset-recovery-rehearsal"
requires-python = ">=3.11,<3.15"
version = "0.1.0"
description = "Local rehearsal of dependent backfills, gap recovery, and provenance verification."
dependencies = [
    "dagster",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rehearsal"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# Example/demo code: the print-based CLI is the intended output channel, and
# this package legitimately imports across modules at call time to break the
# asset/helper cycle. Both are deliberate here, not oversights.
extend-ignore = [
    "T201",
    "TID252",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: drills that launch real Dagster runs",
]
